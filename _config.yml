# Site settings
title: "Lbin's Lab"
email: bongjin.lee.dev@gmail.com
description: "iOS Developer. 최신 AI 기술을 탐색하고, 실제 개발과 일상에 어떻게 활용할 수 있는지 정리합니다."
twitter_username:
github_username: Lbin91
minimal_mistakes_skin: dark
search: true
locale: ko-KR

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
future: true
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Asia/Seoul

include:
  - _pages

exclude:
  - .AI_TEAM
  - .DS_Store
  - .omx
  - .ruby-lsp
  - Gemfile
  - Gemfile.lock
  - PERSONA.md
  - docs
  - reports
  - vendor

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Bongjin Lee"
  avatar: "/assets/images/profile_bear.png"
  bio: "iOS Developer. 최신 AI 기술과 그 활용법을 정리합니다."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Lbin91"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Lbin91"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      og_image: "/assets/images/profile_bear.png"
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
